# Vize releases several times a day; let its packages skip pnpm's minimum release age.
minimumReleaseAgeExclude:
  - vize
  - oxlint-plugin-vize
  - "@vizejs/*"
allowBuilds:
  esbuild: true
  vue-demi: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.6.0
overrides:
  vite@*: "catalog:"
# Plugins' `vite` peer ranges don't cover the vite-plus-core version `vite` is overridden with.
peerDependencyRules:
  allowedVersions:
    vite: "*"
