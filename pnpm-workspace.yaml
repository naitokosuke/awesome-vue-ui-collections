# Vize releases several times a day; let its packages skip pnpm's minimum release age.
minimumReleaseAgeExclude:
  - vize
  - oxlint-plugin-vize
  - '@vizejs/*'
allowBuilds:
  esbuild: true
  vue-demi: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
