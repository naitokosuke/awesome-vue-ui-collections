name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a failing npm stats fetch or a library release that breaks a demo shows up without a push.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Installs Vite+ (the version in pnpm-workspace.yaml's catalog), Node.js and pnpm, then the dependencies.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "26"
          cache: true
      # The browser tests run in headless Chromium. Its download is cached per lockfile;
      # `install --with-deps` still installs the OS packages and skips a browser that's already there.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: vp exec playwright install --with-deps chromium
      - run: vp run check
      - run: vp test run
      # Fetches npm stats, and fails if any package's can't be fetched.
      - run: vp run build
