<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Libraries · awesome-vue-ui-collections</title>
    <meta name="description" content="Every Vue UI library in the comparison, by kind, with its npm stats and links." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="module" src="/src/libraries.ts"></script>
    <style>
      body {
        margin: 0;
      }

      /* Following a library's link: its logo and name travel from its row to its column. */
      @media (prefers-reduced-motion: no-preference) {
        @view-transition {
          navigation: auto;
        }
      }

      /* Only they move: the new page is there at once, and nothing of the old one is drawn over it
         (two unrelated layouts cross-fading read as noise). */
      ::view-transition-old(*) {
        display: none;
      }

      ::view-transition-new(*) {
        animation: none;
      }

      ::view-transition-group(lib-logo),
      ::view-transition-group(lib-name) {
        animation-duration: 0.3s;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
    </style>
    <script>
      // No other navigation animates: there must be a row to leave (.vt-from) and a column to reach (.vt-to).
      addEventListener("pageswap", (event) => {
        if (!document.querySelector(".vt-from")) event.viewTransition?.skipTransition();
      });
      addEventListener("pagereveal", (event) => {
        if (!document.querySelector(".vt-to")) event.viewTransition?.skipTransition();
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
