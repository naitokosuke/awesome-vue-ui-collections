<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Libraries · awesome-vue-ui-collections</title>
    <meta name="description" content="Every Vue UI library in the comparison, by kind, with its npm stats and links." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="module" src="/src/libraries.ts"></script>
    <style>
      body {
        margin: 0;
      }

      /* Between the pages: each library's logo and name travel between its row and its column (see
         useLibraryTravel), the new ones only, resized on the way. */
      @media (prefers-reduced-motion: no-preference) {
        @view-transition {
          navigation: auto;
        }
      }

      ::view-transition-group(*) {
        animation-duration: 0.35s;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }

      ::view-transition-old(*) {
        display: none;
      }

      ::view-transition-new(*) {
        animation: none;
      }

      /* One with nowhere to go, or coming from nowhere, fades with its page. */
      ::view-transition-old(*):only-child {
        display: block;
        animation: avc-page-out 0.2s ease-out both;
      }

      /* The new page fades in over the old one, which stays whole beneath it (fading both lets the
         canvas through). */
      ::view-transition-old(root) {
        display: block;
        animation: none;
      }

      ::view-transition-new(*):only-child,
      ::view-transition-new(root) {
        animation: avc-page-in 0.2s ease-out;
      }

      @keyframes avc-page-in {
        from {
          opacity: 0;
        }
      }

      @keyframes avc-page-out {
        to {
          opacity: 0;
        }
      }
    </style>
    <script>
      // Never fade to a page whose app isn't rendered yet.
      addEventListener("pagereveal", (event) => {
        if (!document.querySelector(".shell")) event.viewTransition?.skipTransition();
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
