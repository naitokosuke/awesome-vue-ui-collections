<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>awesome-vue-ui-collections</title>
    <meta
      name="description"
      content="Vue UI libraries side by side: the same button, input, select, switch and dialog in every library, row by row."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="module" src="/src/main.ts"></script>
    <style>
      body {
        margin: 0;
      }

      /* Between the pages: the new one fades in over the old one, which stays whole beneath it
         (fading both lets the canvas through). */
      @media (prefers-reduced-motion: no-preference) {
        @view-transition {
          navigation: auto;
        }
      }

      ::view-transition-old(root) {
        animation: none;
      }

      ::view-transition-new(root) {
        animation: avc-page-in 0.2s ease-out;
      }

      @keyframes avc-page-in {
        from {
          opacity: 0;
        }
      }

      /* One library's logo and name travel between its row and its column (.linked on each page):
         the new ones only, resized on the way. */
      ::view-transition-old(lib-logo),
      ::view-transition-old(lib-name) {
        display: none;
      }

      ::view-transition-new(lib-logo),
      ::view-transition-new(lib-name) {
        animation: none;
      }

      ::view-transition-group(lib-logo),
      ::view-transition-group(lib-name) {
        animation-duration: 0.3s;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
    </style>
    <script>
      // Never fade to a page whose app isn't rendered yet.
      addEventListener("pagereveal", (event) => {
        if (!document.querySelector(".shell")) event.viewTransition?.skipTransition();
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
