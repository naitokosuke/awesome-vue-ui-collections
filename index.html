<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>awesome-vue-ui-collections</title>
    <meta
      name="description"
      content="Vue UI libraries side by side: the same button, input, select, switch and dialog in every library, row by row."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="module" src="/src/main.ts"></script>
    <style>
      body {
        margin: 0;
      }

      /* Between the pages: the followed library's logo and name travel from its row to its column,
         everything else cross-fades. */
      @media (prefers-reduced-motion: no-preference) {
        @view-transition {
          navigation: auto;
        }
      }

      ::view-transition-group(lib-logo),
      ::view-transition-group(lib-name) {
        animation-duration: 0.3s;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
    </style>
    <script>
      // Never cross-fade to a page whose app isn't rendered yet.
      addEventListener("pagereveal", (event) => {
        if (!document.querySelector(".shell")) event.viewTransition?.skipTransition();
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
